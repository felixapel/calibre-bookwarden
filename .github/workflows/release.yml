name: Release production images

on:
  push:
    tags: ["v*"]

# Gitea v1-tests remains the canonical full integration evidence. This workflow
# gates the exact immutable artifacts that GitHub publishes and releases.
permissions:
  contents: read
  statuses: read
  packages: write
  id-token: write
  attestations: write

jobs:
  verify-release:
    name: Verify tag and executable Certificate A release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.15"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Verify the tag names a main-ancestral package revision
        run: |
          set -euo pipefail
          test "$(date -u +%F)" \< "2026-10-17"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$version"
          reviewed_revision="$(git rev-parse HEAD)"
          printf '%s\n' "$reviewed_revision" | grep -Eq '^[0-9a-f]{40}$'
          test "$GITHUB_SHA" = "$reviewed_revision"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$reviewed_revision" origin/main
      - name: Require owner-attested canonical Gitea evidence for this exact revision
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/verify_gitea_canonical_status.py \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --creator felixapel
      - name: Install the locked local release boundary
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            calibre ghostscript qpdf tesseract-ocr
      - name: Run the repository's executable Certificate A release gate
        run: ./scripts/verify-calibre-gate.sh

  publish-images:
    name: Publish and attest ${{ matrix.name }}
    needs: verify-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: certificate-a
            target: certificate-a
            image_suffix: ""
          - name: writer
            target: writer
            image_suffix: -writer
          - name: edge
            target: caddy-edge
            image_suffix: -edge
    steps:
      - name: Reject an expired Prometheus exception before publishing
        run: |
          set -euo pipefail
          test "$(date -u +%F)" \< "2026-10-17"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: source
        name: Bind the publication to the checked-out revision
        run: |
          set -euo pipefail
          reviewed_revision="$(git rev-parse HEAD)"
          printf '%s\n' "$reviewed_revision" | grep -Eq '^[0-9a-f]{40}$'
          test "$GITHUB_SHA" = "$reviewed_revision"
          printf 'revision=%s\n' "$reviewed_revision" >> "$GITHUB_OUTPUT"
          printf 'image=ghcr.io/%s%s\n' "$GITHUB_REPOSITORY" "${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.source.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: |
            BOOKAUDIT_BUILD_REVISION=${{ steps.source.outputs.revision }}
          outputs: type=image,name=${{ steps.source.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Verify the published digest's OCI provenance and runtime boundary
        env:
          IMAGE: ${{ steps.source.outputs.image }}@${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.source.outputs.revision }}
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          case "$TARGET" in
            certificate-a)
              test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "10001:10001"
              docker run --rm "$IMAGE" --help >/dev/null
              docker run --rm --entrypoint sh "$IMAGE" -c '
                test ! -e /opt/calibre/calibredb &&
                python -c "import importlib.util as u; assert u.find_spec(\"openai\") is None; assert u.find_spec(\"qdrant_client\") is None; assert u.find_spec(\"fastmcp\") is None"
              '
              ;;
            writer)
              test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "10001:10001"
              docker run --rm --entrypoint sh "$IMAGE" -c 'bookaudit --help >/dev/null && test -x /opt/calibre/calibredb'
              ;;
            caddy-edge)
              docker run --rm "$IMAGE" version | grep -F 'v2.11.4-bookaudit-patched'
              docker run --rm "$IMAGE" list-modules | grep -Fx 'tls.get_certificate.tailscale'
              ;;
          esac
      - name: Install exact Trivy scanner
        env:
          TRIVY_IMAGE: aquasec/trivy@sha256:c42bb3221509b0a9fa2291cd79a3a818b30a172ab87e9aac8a43997a5b56f293
        run: |
          set -euo pipefail
          docker pull "$TRIVY_IMAGE"
          container_id="$(docker create "$TRIVY_IMAGE")"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          install -d -m 0755 "$RUNNER_TEMP/trivy-bin"
          docker cp "$container_id:/usr/local/bin/trivy" "$RUNNER_TEMP/trivy-bin/trivy"
          test "$("$RUNNER_TEMP/trivy-bin/trivy" --version)" = "Version: 0.56.1"
          printf '%s\n' "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Reject high or critical vulnerabilities in the exact published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          cache: "false"
          image-ref: ${{ steps.source.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret
      - name: Smoke the exact Certificate A image with empty production state
        if: matrix.target == 'certificate-a'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.source.outputs.image }}
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME=bookaudit_release_gate
          export BOOKAUDIT_IMAGE="$IMAGE@$DIGEST"
          export BOOKAUDIT_RELEASE_DIGEST="$DIGEST"
          export BOOKAUDIT_LIBRARY_HOST_PATH=/tmp/bookaudit-release-library
          export BOOKAUDIT_PORT=18080
          export POSTGRES_PASSWORD=release-admin-password-unique-2026
          export POSTGRES_APP_PASSWORD=release-app-password-unique-2026
          export POSTGRES_VERIFIER_PASSWORD=release-verifier-password-unique-2026
          export POSTGRES_WRITER_PASSWORD=release-writer-password-unique-2026
          export POSTGRES_MIGRATOR_PASSWORD=release-migrator-password-unique-2026
          export BOOKAUDIT_APP_POSTGRES_DSN=postgresql+psycopg://bookaudit_app:release-app-password-unique-2026@postgres:5432/bookaudit
          export BOOKAUDIT_VERIFIER_POSTGRES_DSN=postgresql+psycopg://bookaudit_verifier:release-verifier-password-unique-2026@postgres:5432/bookaudit
          export BOOKAUDIT_WRITER_POSTGRES_DSN=postgresql+psycopg://bookaudit_writer:release-writer-password-unique-2026@postgres:5432/bookaudit
          export BOOKAUDIT_MIGRATOR_POSTGRES_DSN=postgresql+psycopg://bookaudit_migrator:release-migrator-password-unique-2026@postgres:5432/bookaudit
          export BOOKAUDIT_API_KEY=release-api-key-with-at-least-32-characters-9Z
          export BOOKAUDIT_TRUSTED_HOSTS=localhost,127.0.0.1
          cleanup() { docker compose down -v --remove-orphans; rm -f .env; }
          trap cleanup EXIT
          install -m 0600 /dev/null .env
          install -d -m 0777 /tmp/bookaudit-release-library
          docker compose config -q
          docker compose up -d --wait postgres valkey
          docker compose --profile maintenance run --rm provision-roles
          docker compose --profile maintenance run --rm migrate
          docker compose up -d --wait verifier app
          curl -fsS -H "X-API-Key: $BOOKAUDIT_API_KEY" -H 'Host: localhost' http://127.0.0.1:18080/api/health/ready
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: localhost' http://127.0.0.1:18080/api/health/ready)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: invalid.example' -H "X-API-Key: $BOOKAUDIT_API_KEY" http://127.0.0.1:18080/api/health/ready)" = 400
          set +e
          acl_output="$(docker compose exec -T postgres sh -lc \
            "PGPASSWORD='$POSTGRES_APP_PASSWORD' psql -v ON_ERROR_STOP=1 --set=VERBOSITY=verbose -U bookaudit_app -d bookaudit -c 'UPDATE operationledger SET state = state WHERE false'" 2>&1)"
          acl_status=$?
          set -e
          test "$acl_status" -ne 0
          grep -F '42501' <<< "$acl_output"
          grep -F 'permission denied for table operationledger' <<< "$acl_output"
      - name: Generate downloadable SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.source.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.name }}-${{ github.ref_name }}
          path: sbom.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.source.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ steps.source.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Keyless-sign the immutable digest
        env:
          IMAGE: ${{ steps.source.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "$IMAGE"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_WORKFLOW_REF" \
            "$IMAGE" >/dev/null
      - name: Emit immutable image receipt
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ steps.source.outputs.revision }}
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          printf '{"target":"%s","image":"%s","digest":"%s","revision":"%s","version":"%s"}\n' \
            "$TARGET" "$IMAGE" "$DIGEST" "$REVISION" "$VERSION" > "$TARGET-release-image.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-${{ matrix.name }}-${{ github.ref_name }}
          path: ${{ matrix.target }}-release-image.json

  promote-images:
    name: Validate all image receipts and promote release tags
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-image-*-${{ github.ref_name }}
          path: release-receipts
          merge-multiple: true
      - name: Validate the complete immutable release manifest
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          expected = {
              "certificate-a": f"ghcr.io/{os.environ['REPOSITORY']}",
              "writer": f"ghcr.io/{os.environ['REPOSITORY']}-writer",
              "caddy-edge": f"ghcr.io/{os.environ['REPOSITORY']}-edge",
          }
          receipts = []
          for path in Path("release-receipts").glob("*-release-image.json"):
              receipt = json.loads(path.read_text())
              target = receipt.get("target")
              if target not in expected or receipt.get("image") != expected[target]:
                  raise SystemExit(f"unexpected image receipt: {path}")
              if receipt.get("revision") != os.environ["REVISION"] or receipt.get("version") != os.environ["VERSION"]:
                  raise SystemExit(f"receipt does not bind the release revision and version: {path}")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", str(receipt.get("digest"))):
                  raise SystemExit(f"receipt has no immutable digest: {path}")
              receipts.append(receipt)
          if {receipt["target"] for receipt in receipts} != set(expected) or len(receipts) != 3:
              raise SystemExit("release requires exactly one validated receipt for each runtime image")
          Path("release-images.json").write_text(json.dumps(sorted(receipts, key=lambda item: item["target"]), indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-images-${{ github.ref_name }}
          path: release-images.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote all fully gated runtime image digests to semver tags
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(date -u +%F)" \< "2026-10-17"
          version="${VERSION#v}"
          minor="${version%.*}"
          python - <<'PY' | while IFS='|' read -r image digest; do
          import json
          for receipt in json.load(open("release-images.json")):
              print(f"{receipt['image']}|{receipt['digest']}")
          PY
            docker buildx imagetools create --tag "$image:$version" --tag "$image:$minor" "$image@$digest"
          done
