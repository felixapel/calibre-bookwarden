name: Release production image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: bookaudit
          POSTGRES_PASSWORD: release-test-password
          POSTGRES_DB: bookaudit_release_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookaudit -d bookaudit_release_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql+psycopg://bookaudit:release-test-password@127.0.0.1:5432/bookaudit_release_test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.15"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Verify tag matches package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Backend release gates
        run: |
          uv sync --frozen --extra dev
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest -m "not benchmark and not ocr_live and not network"
          uv run python scripts/benchmark_50k_metadata.py
          uv export --frozen --no-hashes --no-emit-project --output-file requirements-audit.txt
          uvx pip-audit==2.10.1 --requirement requirements-audit.txt
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring:/etc/prometheus:ro" \
            prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893 \
            check config /etc/prometheus/prometheus.yml
      - name: Frontend release gates
        working-directory: webui
        run: |
          npm ci
          npm run lint -- --max-warnings=0
          npm run build
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
          npx playwright test --project=chromium --project=mobile-chromium --reporter=line

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Reject high or critical vulnerabilities in the exact release digest
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Boot the exact digest with empty production state
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail
          export COMPOSE_PROJECT_NAME=bookaudit_release_gate
          export BOOKAUDIT_IMAGE="$IMAGE@$DIGEST"
          export BOOKAUDIT_LIBRARY_HOST_PATH=/tmp/bookaudit-release-library
          export BOOKAUDIT_PORT=18080
          export POSTGRES_PASSWORD=release-admin-password-unique-2026
          export POSTGRES_APP_PASSWORD=release-app-password-unique-2026
          export POSTGRES_WRITER_PASSWORD=release-writer-password-unique-2026
          export POSTGRES_MIGRATOR_PASSWORD=release-migrator-password-unique-2026
          export BOOKAUDIT_APP_POSTGRES_DSN=postgresql+psycopg://bookaudit_app:release-app-password-unique-2026@postgres:5432/bookaudit
          export BOOKAUDIT_WRITER_POSTGRES_DSN=postgresql+psycopg://bookaudit_writer:release-writer-password-unique-2026@postgres:5432/bookaudit
          export BOOKAUDIT_MIGRATOR_POSTGRES_DSN=postgresql+psycopg://bookaudit_migrator:release-migrator-password-unique-2026@postgres:5432/bookaudit
          export BOOKAUDIT_API_KEY=release-api-key-with-at-least-32-characters-9Z
          export BOOKAUDIT_TRUSTED_HOSTS=localhost,127.0.0.1
          cleanup() { docker compose down -v --remove-orphans; }
          trap cleanup EXIT
          touch .env
          install -d -m 0750 /tmp/bookaudit-release-library .state .artifacts .writer-artifacts user_library
          docker pull "$BOOKAUDIT_IMAGE"
          docker compose up -d --wait postgres valkey
          docker compose --profile maintenance run --rm migrate
          docker compose up -d --wait writer app
          curl -fsS -H "X-API-Key: $BOOKAUDIT_API_KEY" -H 'Host: localhost' \
            http://127.0.0.1:18080/api/health/ready
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: localhost' \
            http://127.0.0.1:18080/api/health/ready)" = 401
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: invalid.example' \
            -H "X-API-Key: $BOOKAUDIT_API_KEY" http://127.0.0.1:18080/api/health/ready)" = 400
          if docker compose exec -T postgres sh -lc \
            "PGPASSWORD='$POSTGRES_APP_PASSWORD' psql -v ON_ERROR_STOP=1 -U bookaudit_app -d bookaudit -c 'UPDATE operationledger SET state = state WHERE false'"; then
            echo 'app role unexpectedly updated the writer ledger' >&2
            exit 1
          fi
      - name: Promote the scanned digest to release tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository }}
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            test -n "$tag" && docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
          done <<< "$TAGS"
      - name: Generate downloadable SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ github.ref_name }}
          path: sbom.spdx.json
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Keyless-sign immutable image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE"
