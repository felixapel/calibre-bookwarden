name: v1.0 tests

# Runs the v1.0 backend tests, WebUI E2E suite, and benchmarks.
# Triggered on push to main/master and on PRs.

on:
  push:
    branches: [ main, master, feat/v1-content-verification ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Backend: pytest (unit + integration) + mypy + ruff
  # ────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (pytest + mypy + ruff)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre tesseract-ocr ghostscript qpdf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy
        run: |
          mypy src

      - name: Run unit + integration tests
        run: |
          pytest -m "not benchmark and not ocr_live and not network" --cov=src --cov-report=xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ────────────────────────────────────────────────────────────────────
  # Benchmarks: only on push to main (slow, ~30s)
  # ────────────────────────────────────────────────────────────────────
  benchmarks:
    name: Benchmarks (pytest-benchmark)
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run benchmarks
        run: |
          mkdir -p .benchmarks
          pytest --benchmark-only --benchmark-json=.benchmarks/baseline.json -m "not ocr_live and not network"
          pytest --benchmark-only --benchmark-json=.benchmarks/ocr_live.json -m "ocr_live" || true

      - name: Upload benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: .benchmarks/baseline.json
          retention-days: 90

  # ────────────────────────────────────────────────────────────────────
  # WebUI: lint + build + Playwright E2E
  # ────────────────────────────────────────────────────────────────────
  webui-lint-build:
    name: WebUI lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        working-directory: webui
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: webui
        run: pnpm lint

      - name: Build
        working-directory: webui
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

  webui-e2e:
    name: WebUI E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, webui-lint-build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pip install -e .

      - name: Install webui deps + Playwright
        working-directory: webui
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Build webui (Playwright serves dist via FastAPI)
        working-directory: webui
        run: pnpm build

      - name: Run Playwright E2E
        working-directory: webui
        run: pnpm exec playwright test --project=chromium --reporter=github,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webui/playwright-report
          retention-days: 30