name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.15"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Python quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Unit, integration, and migration tests
        run: uv run pytest -m "not benchmark and not ocr_live and not network" --cov=src --cov-report=xml
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --output-file requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: webui
        run: npm ci
      - name: Frontend quality and dependency gates
        working-directory: webui
        run: |
          npm run lint -- --max-warnings=0
          npm run build
          npm audit --audit-level=high
      - name: Install Chromium
        working-directory: webui
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: webui
        run: npm run e2e:chromium -- --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: webui/playwright-report

  container:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image from locks
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: calibre-ai-auditor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Verify runtime and Compose contract
        env:
          BOOKAUDIT_LIBRARY_HOST_PATH: /tmp
          BOOKAUDIT_APP_POSTGRES_DSN: postgresql+psycopg://app:test@postgres/bookaudit
          BOOKAUDIT_WRITER_POSTGRES_DSN: postgresql+psycopg://writer:test@postgres/bookaudit
          BOOKAUDIT_MIGRATOR_POSTGRES_DSN: postgresql+psycopg://migrator:test@postgres/bookaudit
          BOOKAUDIT_API_KEY: ci-api-key-at-least-thirty-two-characters
          POSTGRES_PASSWORD: ci-only-password
        run: |
          test "$(docker image inspect calibre-ai-auditor:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint sh calibre-ai-auditor:ci -c '! python -c "import pytest" && bookaudit --help >/dev/null'
          docker compose --profile maintenance --profile optional config -q
      - name: Scan image for high vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: calibre-ai-auditor:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
