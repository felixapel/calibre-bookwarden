name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: bookaudit
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: bookaudit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookaudit -d bookaudit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql+psycopg://bookaudit:ci-postgres-password@127.0.0.1:5432/bookaudit_test
      TEST_VALKEY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.15"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - name: Install Calibre integration dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Python quality gates
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
      - name: Unit, integration, and migration tests
        run: |
          BOOKAUDIT_DATABASE__BACKEND=postgres \
            BOOKAUDIT_DATABASE__POSTGRES_DSN="$TEST_POSTGRES_DSN" \
            uv run bookaudit migrate
          test -n "$TEST_POSTGRES_DSN"
          test -n "$TEST_VALKEY_URL"
          uv run pytest tests/test_retention_postgres_valkey.py -q
          uv run pytest -m "not benchmark and not ocr_live and not network" --cov=src --cov-report=xml
      - name: Metadata 50k release gate
        run: uv run python scripts/benchmark_50k_metadata.py
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --output-file requirements-audit.txt
          uvx pip-audit==2.10.1 --requirement requirements-audit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.15"
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install Calibre integration dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y calibre
      - name: Install locked backend dependencies
        run: uv sync --frozen --extra dev
      - name: Install exact frontend dependencies
        working-directory: webui
        run: npm ci
      - name: Frontend quality and dependency gates
        working-directory: webui
        run: |
          npm run lint -- --max-warnings=0
          npm run build
          npm audit --audit-level=high
      - name: Install Chromium
        working-directory: webui
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        working-directory: webui
        run: npx playwright test --project=chromium --project=mobile-chromium --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: webui/playwright-report

  container:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build production image from locks
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: calibre-ai-auditor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Verify runtime and Compose contract
        env:
          BOOKAUDIT_LIBRARY_HOST_PATH: /tmp
          BOOKAUDIT_APP_POSTGRES_DSN: postgresql+psycopg://app:test@postgres/bookaudit
          BOOKAUDIT_WRITER_POSTGRES_DSN: postgresql+psycopg://writer:test@postgres/bookaudit
          BOOKAUDIT_MIGRATOR_POSTGRES_DSN: postgresql+psycopg://migrator:test@postgres/bookaudit
          BOOKAUDIT_API_KEY: ci-api-key-at-least-thirty-two-characters
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_APP_PASSWORD: app
          POSTGRES_WRITER_PASSWORD: writer
          POSTGRES_MIGRATOR_PASSWORD: migrator
        run: |
          test "$(docker image inspect calibre-ai-auditor:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint sh calibre-ai-auditor:ci -c '! python -c "import pytest" && bookaudit --help >/dev/null'
          docker run --rm calibre-ai-auditor:ci retention | grep -F 'Dry run only'
          docker compose --profile maintenance --profile optional config -q
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring:/etc/prometheus:ro" \
            prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893 \
            check config /etc/prometheus/prometheus.yml
      - name: Scan image for high vulnerabilities
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: calibre-ai-auditor:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
