{{define "content"}}
<h1>Library</h1>
{{template "calibre" .}}
{{with index0 .Runs}}<h2>Last check</h2>
<p><a href="/runs/{{.Run.ID}}">Run {{.Run.ID}}</a>, started {{when .Run.StartedAt}}: <strong>{{statusText .Run.Status}}</strong></p>
{{template "counts" .Progress}}
{{else}}<p>No library check has run yet.</p>{{end}}
{{template "start" .}}
{{end}}
