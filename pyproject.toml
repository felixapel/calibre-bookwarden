[project]
name = "calibre-ai-auditor"
version = "0.1.0"
description = "CLI for auditing Calibre book metadata with evidence packages and AI-assisted judgments"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Calibre AI Auditor Contributors" }]
dependencies = [
    "typer[all]>=0.12.3",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "google-genai>=0.1.0",
    "pymupdf4llm>=0.0.12",
    "ocrmypdf>=16.3.0",
    "rich>=13.7.1",
    "python-dotenv>=1.0.1",
    "sqlmodel>=0.0.19",
    "imagehash>=4.3.1",
    "pillow>=10.3.0",
    "fastapi>=0.111.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.30.0",
    "aiofiles>=23.0.0",
    "psycopg[binary]>=3.1.18",
    "qdrant-client>=1.9.0",
    "jinja2>=3.1.3",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]
ingest = [
    "watchdog>=4.0.0",
]

[project.scripts]
bookaudit = "calibre_ai_auditor.cli.main:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PT"]
ignore = ["B008", "ARG001", "ARG002"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
