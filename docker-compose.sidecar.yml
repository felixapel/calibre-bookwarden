services:
  calibre-bookwarden:
    image: ghcr.io/felixapel/calibre-bookwarden:latest
    container_name: calibre-bookwarden
    restart: unless-stopped
    ports:
      - "8084:8080"  # WebUI & API (host 8084 avoids conflict with Paperless-ngx on 8000)
    environment:
      - BOOKAUDIT_DATABASE__BACKEND=sqlite
      - BOOKAUDIT_DB_PATH=/config/bookaudit.db
      - BOOKAUDIT_ARTIFACTS_DIR=/config/artifacts
      - BOOKAUDIT_QUEUE__BACKEND=memory
      - BOOKAUDIT_RATE_LIMITS__BACKEND=memory
      - BOOKAUDIT_READ_ONLY=false
      - BOOKAUDIT_LIBRARY_PATH=/calibre
      - BOOKAUDIT_CALIBRE_WEB__URL=http://calibre-web-automated:8083
      - BOOKAUDIT_CALIBRE_WEB__THUMBNAILS_DIR=/thumbnails
      - CALIBRE_WEB_CONTAINER=calibre-web-automated
      - CALIBRE_WEB_URL=http://calibre-web-automated:8083
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - /mnt/user/MEDIA/Books/Calibre Library:/calibre:rw
      - /mnt/user/appdata/calibre-bookwarden:/config:rw
      - /mnt/user/appdata/calibre-web-automated/thumbnails:/thumbnails:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - calibre-net
    depends_on:
      - calibre-web-automated

  calibre-web-automated:
    image: crocodilestick/calibre-web-automated:latest
    container_name: calibre-web-automated
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      - PUID=99
      - PGID=100
      - TZ=Europe/Berlin
      - DOCKER_MODS=linuxserver/mods:universal-calibre
    volumes:
      - /mnt/user/MEDIA/Books/Calibre Library:/books:rw
      - /mnt/user/appdata/calibre-web-automated:/config:rw
    networks:
      - calibre-net

networks:
  calibre-net:
    driver: bridge
