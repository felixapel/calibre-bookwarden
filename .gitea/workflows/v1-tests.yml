name: v1-tests-gitea

# Gitea Actions variant for self-hosted act_runner on Unraid (per CLAUDE.md).
# Mirrors .github/workflows/v1-tests.yml with Gitea-specific syntax.

on:
  push:
    branches: [ main, feat/v1-content-verification ]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + mypy + ruff)
    runs-on: ubuntu-latest
    container:
      image: python:3.12.13-slim-bookworm@sha256:8a7e7cc04fd3e2bd787f7f24e22d5d119aa590d429b50c95dfe12b3abe52f48b
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install system deps (calibre + tesseract + ocrmypdf)
        run: |
          apt-get update
          apt-get install -y calibre tesseract-ocr ghostscript qpdf ocrmypdf

      - name: Install uv and locked Python deps
        run: |
          python -m pip install uv==0.11.15
          uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Run unit + integration tests
        run: |
          uv run pytest -m "not benchmark and not ocr_live and not network" \
                 --cov=src --cov-report=xml -v

      - name: Metadata 50k release gate
        run: uv run python scripts/benchmark_50k_metadata.py

      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --output-file requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-xml
          path: coverage.xml

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    container:
      image: python:3.12.13-slim-bookworm@sha256:8a7e7cc04fd3e2bd787f7f24e22d5d119aa590d429b50c95dfe12b3abe52f48b
    if: gitea.event_name == 'push'
    needs: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Python deps
        run: |
          pip install uv==0.11.15
          uv sync --frozen --extra dev
      - name: Run benchmarks
        run: |
          mkdir -p .benchmarks
          uv run pytest --benchmark-only --benchmark-json=.benchmarks/baseline.json \
                 -m "not ocr_live and not network"
      - name: Upload benchmark baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: benchmark-baseline
          path: .benchmarks/baseline.json

  webui:
    name: WebUI E2E (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy@sha256:7b86926fff94374389e8e1f4fdc5c76d050d4a06a7886bb537bf412b20e2b71e
    needs: [backend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          apt-get update
          apt-get install -y calibre
          python -m pip install --upgrade pip
          pip install uv==0.11.15
          uv sync --frozen --extra dev

      - name: Install webui deps
        working-directory: webui
        run: npm ci

      - name: Lint and audit webui
        working-directory: webui
        run: |
          npm run lint -- --max-warnings=0
          npm audit --audit-level=high

      - name: Build webui
        working-directory: webui
        run: npm run build

      - name: Run Playwright E2E
        working-directory: webui
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: npx playwright test --project=chromium --project=mobile-chromium --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: webui/playwright-report
