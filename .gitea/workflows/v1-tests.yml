name: certificate-a-production-gates

# Canonical pipeline for the private Gitea repository. Every action is pinned
# to a commit and uv is installed by its pinned action; no network response is
# piped into a privileged shell.
on:
  push:
    branches: [main, feature/certificate-a-production]
  pull_request:

env:
  PYTHON_VERSION: "3.12.13"
  UV_VERSION: "0.11.15"

jobs:
  backend:
    name: Backend, PostgreSQL ACL, and dependency gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: bookaudit
          POSTGRES_PASSWORD: gitea-admin-test-password
          POSTGRES_DB: bookaudit_gitea_test
        options: >-
          --health-cmd "pg_isready -U bookaudit -d bookaudit_gitea_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.15"
          enable-cache: true

      - name: Install pinned Python and system integration tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            calibre ghostscript postgresql-client qpdf redis-tools tesseract-ocr tesseract-ocr-eng
          uv python install "$PYTHON_VERSION"
          uv sync --python "$PYTHON_VERSION" --frozen

      - name: Prove locks, style, types, and the hermetic backend suite
        run: |
          uv lock --check
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src
          uv run pytest \
            -m 'not benchmark and not ocr_live and not network and not v2_live' \
            --ignore=tests/test_retention_postgres_valkey.py \
            --ignore=tests/test_v2_supervised_pilot_integration.py

      - name: Provision roles and migrate exactly once
        env:
          PGHOST: postgres
          PGUSER: bookaudit
          PGPASSWORD: gitea-admin-test-password
          POSTGRES_USER: bookaudit
          POSTGRES_DB: bookaudit_gitea_test
          POSTGRES_APP_PASSWORD: gitea-app-test-password
          POSTGRES_VERIFIER_PASSWORD: gitea-verifier-test-password
          POSTGRES_WRITER_PASSWORD: gitea-writer-test-password
          POSTGRES_MIGRATOR_PASSWORD: gitea-migrator-test-password
          BOOKAUDIT_PROFILE: production
          BOOKAUDIT_DATABASE__BACKEND: postgres
          BOOKAUDIT_DATABASE__POSTGRES_DSN: postgresql+psycopg://bookaudit_migrator:gitea-migrator-test-password@postgres:5432/bookaudit_gitea_test
        run: |
          ./scripts/postgres-init-roles.sh
          uv run bookaudit-certificate-a migrate

      - name: Run real PostgreSQL and Valkey abuse gates
        env:
          TEST_POSTGRES_DSN: postgresql+psycopg://bookaudit:gitea-admin-test-password@postgres:5432/bookaudit_gitea_test
          TEST_VALKEY_URL: redis://valkey:6379/0
        run: |
          uv run pytest tests/test_retention_postgres_valkey.py -q
          uv run pytest tests/test_runtime_role_acl_postgres.py -q

      - name: Audit the exact Certificate A Python closure
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project --output-file requirements-certificate-a.txt
          uvx pip-audit==2.10.1 --requirement requirements-certificate-a.txt

      - name: Metadata 50k release gate
        run: uv run python scripts/benchmark_50k_metadata.py

  real-services:
    name: Real Certificate A Calibre, OCR, and PostgreSQL boundaries
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: bookaudit
          POSTGRES_PASSWORD: gitea-certificate-a-required-password
          POSTGRES_DB: bookaudit_certificate_a_test
        options: >-
          --health-cmd "pg_isready -U bookaudit -d bookaudit_certificate_a_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.15"
      - name: Install exact integration boundary
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            calibre fonts-dejavu-core postgresql-client redis-tools tesseract-ocr tesseract-ocr-eng
          uv python install "$PYTHON_VERSION"
          uv sync --python "$PYTHON_VERSION" --frozen --no-dev --group test
          command -v calibredb
          command -v ebook-meta
          command -v tesseract
          uv run --no-sync ocrmypdf --version
          pg_isready -h postgres -U bookaudit -d bookaudit_certificate_a_test
          test "$(redis-cli -u redis://valkey:6379/0 ping)" = "PONG"
      - name: Provision and migrate the disposable integration database
        env:
          PGHOST: postgres
          PGUSER: bookaudit
          PGPASSWORD: gitea-certificate-a-required-password
          POSTGRES_USER: bookaudit
          POSTGRES_DB: bookaudit_certificate_a_test
          POSTGRES_APP_PASSWORD: gitea-certificate-a-app-password
          POSTGRES_VERIFIER_PASSWORD: gitea-certificate-a-verifier-password
          POSTGRES_WRITER_PASSWORD: gitea-certificate-a-writer-password
          POSTGRES_MIGRATOR_PASSWORD: gitea-certificate-a-migrator-password
          BOOKAUDIT_PROFILE: production
          BOOKAUDIT_DATABASE__BACKEND: postgres
          BOOKAUDIT_DATABASE__POSTGRES_DSN: postgresql+psycopg://bookaudit_migrator:gitea-certificate-a-migrator-password@postgres:5432/bookaudit_certificate_a_test
        run: |
          ./scripts/postgres-init-roles.sh
          uv run --no-sync bookaudit-certificate-a migrate
      - name: Prove concurrent claim, fence recovery, real Calibre, and real OCR
        env:
          TEST_POSTGRES_DSN: postgresql+psycopg://bookaudit:gitea-certificate-a-required-password@postgres:5432/bookaudit_certificate_a_test
          TEST_VALKEY_URL: redis://valkey:6379/0
        run: |
          set -o pipefail
          uv run --no-sync pytest tests/test_certificate_a_worker_postgres.py -q -rs \
            | tee /tmp/certificate-a-required-pytest.log
          test "${PIPESTATUS[0]}" -eq 0
          uv run --no-sync pytest tests/test_certificate_a_real_boundaries.py -m ocr_live -q -rs \
            | tee -a /tmp/certificate-a-required-pytest.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -Eq "[0-9]+ skipped|SKIPPED" /tmp/certificate-a-required-pytest.log
          grep -Eq "1 passed" /tmp/certificate-a-required-pytest.log
          grep -Eq "2 passed" /tmp/certificate-a-required-pytest.log

  webui:
    name: Certificate A WebUI contract
    runs-on: ubuntu-latest
    needs: backend
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy@sha256:e4f20543d7da3faeddbce0176b447331ad652f0ca8c669dc7e7b205f2067677e
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.4"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install, audit, lint, and build
        working-directory: webui
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint -- --max-warnings=0
          npm run build
      - name: Run desktop and mobile browser contracts
        working-directory: webui
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: npx playwright test --project=chromium --project=mobile-chromium --reporter=line

  container:
    name: Certificate A image, Compose, and vulnerability contract
    runs-on: ubuntu-latest
    needs: [backend, webui, real-services]
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Docker and Compose clients
        run: |
          # Compose v1 expands every profile in `config --services`; the production gate requires v2 semantics.
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl docker.io
          install -d -m 0755 /usr/local/lib/docker/cli-plugins
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/docker/compose/releases/download/v5.1.4/docker-compose-linux-x86_64 \
            --output /usr/local/lib/docker/cli-plugins/docker-compose
          echo '33b208d7e76639db742fae84b966cc01dacae58ca3fc4dabbc907045aefdf0c4  /usr/local/lib/docker/cli-plugins/docker-compose' | sha256sum --check --strict
          chmod 0755 /usr/local/lib/docker/cli-plugins/docker-compose
          docker version
          docker compose version
      - name: Build the explicitly separated application, writer, and edge images
        run: |
          reviewed_revision="$(git rev-parse HEAD)"
          printf '%s\n' "$GITHUB_SHA" | grep -Eq '^[0-9a-f]{40}$'
          test "$GITHUB_SHA" = "$reviewed_revision"
          docker build --target certificate-a \
            --build-arg BOOKAUDIT_BUILD_REVISION="$reviewed_revision" \
            -t calibre-ai-auditor:gitea-ci .
          docker build --target writer \
            --build-arg BOOKAUDIT_BUILD_REVISION="$reviewed_revision" \
            -t calibre-ai-auditor-writer:gitea-ci .
          docker build --target caddy-edge \
            --build-arg BOOKAUDIT_BUILD_REVISION="$reviewed_revision" \
            -t calibre-ai-auditor-edge:gitea-ci .
      - name: Verify image dependency and privilege boundaries
        run: |
          reviewed_revision="$(git rev-parse HEAD)"
          test "$(docker image inspect calibre-ai-auditor:gitea-ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect calibre-ai-auditor-writer:gitea-ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect calibre-ai-auditor:gitea-ci \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$reviewed_revision"
          test "$(docker image inspect calibre-ai-auditor-writer:gitea-ci \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$reviewed_revision"
          test "$(docker image inspect calibre-ai-auditor-edge:gitea-ci \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$reviewed_revision"
          docker run --rm --entrypoint sh calibre-ai-auditor:gitea-ci -c '
            bookaudit-certificate-a --help >/dev/null &&
            test ! -e /opt/calibre/calibredb &&
            python -c "import importlib.util as u; assert u.find_spec(\"openai\") is None; assert u.find_spec(\"qdrant_client\") is None; assert u.find_spec(\"fastmcp\") is None"
          '
          docker run --rm --entrypoint sh calibre-ai-auditor-writer:gitea-ci -c 'bookaudit --help >/dev/null && test -x /opt/calibre/calibredb'
          docker run --rm calibre-ai-auditor-edge:gitea-ci version | grep -F 'v2.11.4-bookaudit-patched'
          docker run --rm calibre-ai-auditor-edge:gitea-ci list-modules | grep -Fx 'tls.get_certificate.tailscale'
      - name: Verify the exact Compose graph and hardened state persistence
        env:
          BOOKAUDIT_LIBRARY_HOST_PATH: /tmp
          BOOKAUDIT_APP_POSTGRES_DSN: postgresql+psycopg://bookaudit_app:test@postgres/bookaudit
          BOOKAUDIT_VERIFIER_POSTGRES_DSN: postgresql+psycopg://bookaudit_verifier:test@postgres/bookaudit
          BOOKAUDIT_WRITER_POSTGRES_DSN: postgresql+psycopg://bookaudit_writer:test@postgres/bookaudit
          BOOKAUDIT_MIGRATOR_POSTGRES_DSN: postgresql+psycopg://bookaudit_migrator:test@postgres/bookaudit
          BOOKAUDIT_API_KEY: ci-api-key-at-least-thirty-two-characters
          BOOKAUDIT_RELEASE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BOOKAUDIT_EDGE_IMAGE: calibre-ai-auditor-edge:gitea-ci
          BOOKAUDIT_DOMAIN: host.tailnet.ts.net
          BOOKAUDIT_EDGE_BIND_IP: 100.64.0.1
          BOOKAUDIT_BASIC_AUTH_USER: auditor
          BOOKAUDIT_BASIC_AUTH_HASH: '$2a$14$IamTD8vwGMlzROKemTC/sOyPiEegh.7r9gjBLX01meH8BHVUfrOCW'
          POSTGRES_PASSWORD: ci-only-admin-password
          POSTGRES_APP_PASSWORD: ci-app-password
          POSTGRES_VERIFIER_PASSWORD: ci-verifier-password
          POSTGRES_WRITER_PASSWORD: ci-writer-password
          POSTGRES_MIGRATOR_PASSWORD: ci-migrator-password
        run: |
          trap 'docker compose down --volumes >/dev/null 2>&1 || true; rm -f .env' EXIT
          install -m 0600 /dev/null .env
          docker compose config -q
          test "$(docker compose --profile maintenance --profile writer --profile writer-maintenance config --services | sort | tr '\n' ' ')" = "app migrate postgres provision-roles retention valkey verifier writer "
          test "$(docker compose --profile monitoring config --services | sort | tr '\n' ' ')" = "app postgres prometheus valkey verifier "
          test "$(docker compose --profile edge config --services | sort | tr '\n' ' ')" = "app caddy postgres valkey verifier "
          docker compose --profile maintenance --profile writer --profile writer-maintenance config -q
          docker compose --profile edge config -q
          docker compose --profile edge up --no-deps --no-start caddy
          caddy_container="$(docker compose --profile edge ps -aq caddy)"
          test "$(docker inspect "$caddy_container" --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | sed -n 's/^BOOKAUDIT_BASIC_AUTH_HASH=//p')" = \
            '$2a$14$IamTD8vwGMlzROKemTC/sOyPiEegh.7r9gjBLX01meH8BHVUfrOCW'
          docker compose --profile edge rm --force caddy
          docker compose up -d --wait postgres valkey
          docker compose exec -T postgres psql -U bookaudit -d bookaudit -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE provenance_smoke (value text NOT NULL)" \
            -c "INSERT INTO provenance_smoke VALUES ('persisted')"
          test "$(docker compose exec -T valkey valkey-cli set production-smoke persisted)" = "OK"
          docker compose restart postgres valkey
          docker compose up -d --wait postgres valkey
          test "$(docker compose exec -T postgres psql -U bookaudit -d bookaudit -Atqc \
            'SELECT value FROM provenance_smoke')" = "persisted"
          test "$(docker compose exec -T valkey valkey-cli get production-smoke)" = "persisted"
          for service in postgres valkey; do
            test "$(docker compose ps -q "$service" | xargs docker inspect \
              --format '{{.HostConfig.ReadonlyRootfs}}')" = "true"
            test "$(docker compose ps -q "$service" | xargs docker inspect \
              --format '{{json .HostConfig.CapDrop}}')" = '["ALL"]'
            test "$(docker compose ps -q "$service" | xargs docker inspect \
              --format '{{json .HostConfig.SecurityOpt}}')" = '["no-new-privileges:true"]'
          done
      - name: Validate Certificate A monitoring rules
        run: |
          trap 'docker rm -f bookaudit-prometheus-smoke bookaudit-metrics-smoke >/dev/null 2>&1 || true; docker network rm bookaudit-monitoring-smoke >/dev/null 2>&1 || true' EXIT
          docker build --file ops/monitoring/Dockerfile.ci \
            --tag bookaudit-prometheus-ci:rules ops/monitoring
          docker run --rm --network none \
            --entrypoint /bin/promtool \
            bookaudit-prometheus-ci:rules \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --network none \
            --workdir /etc/prometheus \
            --entrypoint /bin/promtool \
            bookaudit-prometheus-ci:rules \
            test rules alerts.test.yml
          docker run --rm --network none --user 1000:1000 \
            --entrypoint /bin/sh \
            bookaudit-prometheus-ci:rules \
            -c 'test -r /run/secrets/bookaudit_api_key'
          docker network create \
            --opt com.docker.network.bridge.enable_ip_masquerade=false \
            bookaudit-monitoring-smoke
          docker run -d --name bookaudit-metrics-smoke \
            --network bookaudit-monitoring-smoke --network-alias app \
            --user 1000:1000 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint /bin/busybox \
            bookaudit-prometheus-ci:rules \
            httpd -f -p 8080 -h /www
          docker run -d --name bookaudit-prometheus-smoke \
            --network bookaudit-monitoring-smoke --user 1000:1000 \
            -p 127.0.0.1::9090 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m \
            --tmpfs /prometheus:rw,nosuid,nodev,noexec,size=64m,uid=1000,gid=1000 \
            bookaudit-prometheus-ci:rules \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/prometheus
          ready=false
          for _ in $(seq 1 25); do
            if docker exec bookaudit-prometheus-smoke promtool check ready >/dev/null 2>&1 && \
              docker exec bookaudit-prometheus-smoke wget -qO- http://localhost:9090/api/v1/targets | \
                grep -q '"health":"up"'; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
          test "$(docker inspect bookaudit-prometheus-smoke \
            --format '{{(index (index .NetworkSettings.Ports "9090/tcp") 0).HostIp}}')" = \
            "127.0.0.1"
          if docker exec bookaudit-prometheus-smoke \
            /bin/busybox nc -z -w 2 1.1.1.1 80; then
            echo "Prometheus unexpectedly reached an external address" >&2
            exit 1
          fi
      - name: Validate the private Caddy edge
        run: |
          trap 'docker rm --force bookaudit-caddy-config-smoke >/dev/null 2>&1 || true' EXIT
          docker create --name bookaudit-caddy-config-smoke \
            -e BOOKAUDIT_DOMAIN=host.tailnet.ts.net \
            -e BOOKAUDIT_EDGE_BIND_IP=100.64.0.1 \
            -e BOOKAUDIT_BASIC_AUTH_USER=auditor \
            -e 'BOOKAUDIT_BASIC_AUTH_HASH=$2a$14$IamTD8vwGMlzROKemTC/sOyPiEegh.7r9gjBLX01meH8BHVUfrOCW' \
            -e BOOKAUDIT_PORT=8080 \
            calibre-ai-auditor-edge:gitea-ci \
            validate --config /tmp/Caddyfile --adapter caddyfile
          docker cp deploy/caddy/Caddyfile.example bookaudit-caddy-config-smoke:/tmp/Caddyfile
          docker start --attach bookaudit-caddy-config-smoke
      - name: Scan release images for high vulnerabilities and secrets
        run: |
          trap 'docker rm -f bookaudit-prometheus-trivy >/dev/null 2>&1 || true' EXIT
          for image in calibre-ai-auditor:gitea-ci calibre-ai-auditor-writer:gitea-ci \
            calibre-ai-auditor-edge:gitea-ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy@sha256:c42bb3221509b0a9fa2291cd79a3a818b30a172ab87e9aac8a43997a5b56f293 image \
              --format table --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
              --scanners vuln,secret "$image"
          done
          docker create --name bookaudit-prometheus-trivy \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:c42bb3221509b0a9fa2291cd79a3a818b30a172ab87e9aac8a43997a5b56f293 image \
            --format table --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
            --ignorefile /tmp/bookaudit-prometheus.trivyignore \
            --scanners vuln,secret \
            prom/prometheus@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
          docker cp ops/monitoring/.trivyignore \
            bookaudit-prometheus-trivy:/tmp/bookaudit-prometheus.trivyignore
          docker start --attach bookaudit-prometheus-trivy

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: gitea.event_name == 'push'
    needs: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.11.15"
      - name: Run benchmark suite
        run: |
          uv python install "$PYTHON_VERSION"
          uv sync --python "$PYTHON_VERSION" --frozen
          uv run pytest --benchmark-only -m "not ocr_live and not network"
