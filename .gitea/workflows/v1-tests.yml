name: v1-tests-gitea

# Gitea Actions variant for self-hosted act_runner on Unraid (per CLAUDE.md).
# Mirrors .github/workflows/v1-tests.yml with Gitea-specific syntax.

on:
  push:
    branches: [ main, feat/v1-content-verification ]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + mypy + ruff)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine@sha256:3d0f7584ed7d04e27fa050d6683a74746608faf21f202be78460d679cc56461f
        env:
          POSTGRES_USER: bookaudit
          POSTGRES_PASSWORD: gitea-test-password
          POSTGRES_DB: bookaudit_gitea_test
        options: >-
          --health-cmd "pg_isready -U bookaudit -d bookaudit_gitea_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:8.1.3-alpine@sha256:d827e7f7552cdee40cc7482dbae9da020f42bc47669af6f71182a4ef76a22773
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql+psycopg://bookaudit:gitea-test-password@postgres:5432/bookaudit_gitea_test
      TEST_VALKEY_URL: redis://valkey:6379/0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install system deps (calibre + tesseract + ocrmypdf)
        run: |
          apt-get update
          apt-get install -y calibre tesseract-ocr ghostscript qpdf ocrmypdf curl ca-certificates

      - name: Install uv and locked Python deps
        run: |
          curl -LsSf https://astral.sh/uv/0.11.15/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          uv python install 3.12.13
          uv sync --python 3.12.13 --frozen --extra dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Run unit + integration tests
        run: |
          BOOKAUDIT_DATABASE__BACKEND=postgres \
            BOOKAUDIT_DATABASE__POSTGRES_DSN="$TEST_POSTGRES_DSN" \
            uv run bookaudit migrate
          test -n "$TEST_POSTGRES_DSN"
          test -n "$TEST_VALKEY_URL"
          uv run pytest tests/test_retention_postgres_valkey.py -q
          uv run pytest -m "not benchmark and not ocr_live and not network" \
                 --cov=src --cov-report=xml -v

      - name: Metadata 50k release gate
        run: uv run python scripts/benchmark_50k_metadata.py

      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project --output-file requirements-audit.txt
          uvx pip-audit==2.10.1 --requirement requirements-audit.txt

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: gitea.event_name == 'push'
    needs: backend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Install Python deps
        run: |
          apt-get update
          apt-get install -y curl ca-certificates
          curl -LsSf https://astral.sh/uv/0.11.15/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
          uv python install 3.12.13
          uv sync --python 3.12.13 --frozen --extra dev
      - name: Run benchmarks
        run: |
          mkdir -p .benchmarks
          uv run pytest --benchmark-only --benchmark-json=.benchmarks/baseline.json \
                 -m "not ocr_live and not network"
  webui:
    name: WebUI E2E (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy@sha256:7b86926fff94374389e8e1f4fdc5c76d050d4a06a7886bb537bf412b20e2b71e
    needs: [backend]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          apt-get update
          apt-get install -y calibre
          python -m pip install --upgrade pip
          pip install uv==0.11.15
          uv sync --frozen --extra dev

      - name: Install webui deps
        working-directory: webui
        run: npm ci

      - name: Lint and audit webui
        working-directory: webui
        run: |
          npm run lint -- --max-warnings=0
          npm audit --audit-level=high

      - name: Build webui
        working-directory: webui
        run: npm run build

      - name: Run Playwright E2E
        working-directory: webui
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: npx playwright test --project=chromium --project=mobile-chromium --reporter=line

  container:
    name: Production image contract
    runs-on: ubuntu-latest
    needs: [backend, webui]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build production image
        run: docker build -t calibre-ai-auditor:gitea-ci .
      - name: Verify runtime, Compose, and Prometheus contracts
        env:
          BOOKAUDIT_LIBRARY_HOST_PATH: /tmp
          BOOKAUDIT_APP_POSTGRES_DSN: postgresql+psycopg://app:test@postgres/bookaudit
          BOOKAUDIT_WRITER_POSTGRES_DSN: postgresql+psycopg://writer:test@postgres/bookaudit
          BOOKAUDIT_MIGRATOR_POSTGRES_DSN: postgresql+psycopg://migrator:test@postgres/bookaudit
          BOOKAUDIT_API_KEY: ci-api-key-at-least-thirty-two-characters
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_APP_PASSWORD: app
          POSTGRES_WRITER_PASSWORD: writer
          POSTGRES_MIGRATOR_PASSWORD: migrator
        run: |
          test "$(docker image inspect calibre-ai-auditor:gitea-ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint sh calibre-ai-auditor:gitea-ci -c '! python -c "import pytest" && bookaudit --help >/dev/null'
          docker run --rm calibre-ai-auditor:gitea-ci retention | grep -F 'Dry run only'
          docker compose --profile maintenance --profile optional config -q
          docker run --rm --entrypoint promtool -v "$PWD/ops/monitoring:/etc/prometheus:ro" \
            prom/prometheus@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893 \
            check config /etc/prometheus/prometheus.yml
      - name: Scan image for high vulnerabilities
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2
        with:
          image-ref: calibre-ai-auditor:gitea-ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
