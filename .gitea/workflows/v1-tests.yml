name: v1-tests-gitea

# Gitea Actions variant for self-hosted act_runner on Unraid (per CLAUDE.md).
# Mirrors .github/workflows/v1-tests.yml with Gitea-specific syntax.

on:
  push:
    branches: [ main, feat/v1-content-verification ]
  pull_request:

jobs:
  backend:
    name: Backend (pytest + mypy + ruff)
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (calibre + tesseract + ocrmypdf)
        run: |
          apt-get update
          apt-get install -y calibre tesseract-ocr ghostscript qpdf ocrmypdf

      - name: Install uv and locked Python deps
        run: |
          python -m pip install uv==0.11.15
          uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Run unit + integration tests
        run: |
          uv run pytest -m "not benchmark and not ocr_live and not network" \
                 --cov=src --cov-report=xml -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
    if: gitea.event_name == 'push'
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install Python deps
        run: |
          pip install uv==0.11.15
          uv sync --frozen --extra dev
      - name: Run benchmarks
        run: |
          mkdir -p .benchmarks
          uv run pytest --benchmark-only --benchmark-json=.benchmarks/baseline.json \
                 -m "not ocr_live and not network"
      - name: Upload benchmark baseline
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: .benchmarks/baseline.json

  webui:
    name: WebUI E2E (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          apt-get update
          apt-get install -y calibre
          python -m pip install --upgrade pip
          pip install uv==0.11.15
          uv sync --frozen --extra dev

      - name: Install webui deps
        working-directory: webui
        run: npm ci

      - name: Lint and audit webui
        working-directory: webui
        run: |
          npm run lint -- --max-warnings=0
          npm audit --audit-level=high

      - name: Build webui
        working-directory: webui
        run: npm run build

      - name: Run Playwright E2E
        working-directory: webui
        env:
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
        run: npx playwright test --project=chromium --reporter=line

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: webui/playwright-report
