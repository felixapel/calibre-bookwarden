services:
  calibre-bookwarden:
    image: ghcr.io/felixapel/calibre-bookwarden:latest
    container_name: calibre-bookwarden
    restart: unless-stopped
    ports:
      - "${PORT:-8084}:8080"
    environment:
      - BOOKAUDIT_DATABASE__BACKEND=sqlite
      - BOOKAUDIT_DB_PATH=/config/bookaudit.db
      - BOOKAUDIT_ARTIFACTS_DIR=/config/artifacts
      - BOOKAUDIT_QUEUE__BACKEND=memory
      - BOOKAUDIT_RATE_LIMITS__BACKEND=memory
      - BOOKAUDIT_LIBRARY_PATH=/calibre
      - BOOKAUDIT_READ_ONLY=${READ_ONLY:-true}
      - BOOKAUDIT_CALIBRE_WEB__URL=${CALIBRE_WEB_URL:-http://calibre-web:8083}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CALIBRE_WEB_CONTAINER=${CALIBRE_WEB_CONTAINER:-calibre-web-automated}
    volumes:
      - ${CALIBRE_LIBRARY_PATH}:/calibre:${LIBRARY_ACCESS_MODE:-rw}
      - ${CONFIG_PATH}:/config
