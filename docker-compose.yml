services:
  app:
    build: .
    image: calibre-ai-auditor:v0.1
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOOKAUDIT_LIBRARY_PATH: /library
      BOOKAUDIT_DB_PATH: /state/bookaudit.db
      BOOKAUDIT_ARTIFACTS_DIR: /artifacts
      BOOKAUDIT_DATABASE__BACKEND: postgres
      BOOKAUDIT_DATABASE__POSTGRES_DSN: ${BOOKAUDIT_DATABASE__POSTGRES_DSN:?set in .env}
      BOOKAUDIT_PROFILE: production
      BOOKAUDIT_LOG_JSON: "true"
      BOOKAUDIT_API_KEY: ${BOOKAUDIT_API_KEY:?set in .env}
      BOOKAUDIT_READ_ONLY: "true"
    volumes:
      - ${BOOKAUDIT_LIBRARY_HOST_PATH:?set in .env}:/library:ro
      - ./user_library:/input_files:ro
      - ./.state:/state
      - ./.artifacts:/artifacts
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:${BOOKAUDIT_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf -H 'X-API-Key: '$$BOOKAUDIT_API_KEY http://localhost:8080/api/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  writer:
    image: calibre-ai-auditor:v0.1
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    command: ["writer"]
    env_file:
      - .env
    environment:
      BOOKAUDIT_PROFILE: production
      BOOKAUDIT_LIBRARY_PATH: /library
      BOOKAUDIT_ARTIFACTS_DIR: /artifacts
      BOOKAUDIT_DATABASE__BACKEND: postgres
      BOOKAUDIT_DATABASE__POSTGRES_DSN: ${BOOKAUDIT_DATABASE__POSTGRES_DSN:?set in .env}
      BOOKAUDIT_QUEUE__BACKEND: valkey
      BOOKAUDIT_QUEUE__VALKEY_URL: redis://valkey:6379/0
      BOOKAUDIT_READ_ONLY: "false"
      BOOKAUDIT_LOG_JSON: "true"
    volumes:
      - ${BOOKAUDIT_LIBRARY_HOST_PATH:?set in .env}:/library:rw
      - ./.artifacts:/artifacts
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

  tika:
    image: apache/tika:latest
    restart: unless-stopped
    profiles: ["optional"]

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookaudit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: bookaudit
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookaudit -d bookaudit"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:latest
    restart: unless-stopped
    volumes:
      - valkey-data:/data

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    profiles: ["optional"]
    volumes:
      - qdrant-data:/qdrant/storage

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    profiles: ["optional"]

volumes:
  postgres-data:
  valkey-data:
  qdrant-data:
