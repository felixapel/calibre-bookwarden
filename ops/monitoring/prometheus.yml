global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bookaudit-certificate-a
    metrics_path: /api/metrics
    fallback_scrape_protocol: PrometheusText0.0.4
    static_configs:
      - targets: ["app:8080"]
    http_headers:
      X-API-Key:
        files: ["/run/secrets/bookaudit_api_key"]
