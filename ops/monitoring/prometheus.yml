global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bookaudit
    metrics_path: /api/metrics
    static_configs:
      - targets: ["app:8080"]
    # Replace before deployment or inject this header at a trusted reverse proxy.
    http_headers:
      X-API-Key:
        values: ["REPLACE_WITH_BOOKAUDIT_API_KEY"]
