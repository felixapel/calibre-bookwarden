global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: bookaudit-certificate-a
    metrics_path: /api/metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]
    http_headers:
      X-API-Key:
        files: ["/etc/prometheus/secrets/bookaudit_api_key"]
