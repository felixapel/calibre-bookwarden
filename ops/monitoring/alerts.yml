groups:
  - name: bookaudit-certificate-a
    rules:
      - alert: BookAuditUnavailable
        expr: up{job="bookaudit-certificate-a"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Certificate A cannot be scraped
          runbook: docs/runbooks/production-operations.md#monitoring-alerts

      - alert: BookAuditCertificateANotReady
        expr: bookaudit_certificate_a_ready == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: Certificate A is not ready
          runbook: docs/runbooks/production-operations.md#monitoring-alerts

      - alert: BookAuditVerifierHeartbeatStale
        expr: bookaudit_verifier_heartbeat_fresh == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: The read-only verifier heartbeat is stale or bound to the wrong release
          runbook: docs/runbooks/production-operations.md#monitoring-alerts

      - alert: BookAuditCertificateAMetricsCollectionFailed
        expr: bookaudit_certificate_a_metrics_collection_success == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: Certificate A run metrics cannot be collected
          runbook: docs/runbooks/production-operations.md#monitoring-alerts

      - alert: BookAuditCertificateARunStalled
        expr: |
          sum(bookaudit_certificate_a_runs{status=~"pending|inventorying|running|cancelling"}) > 0
          and
          bookaudit_certificate_a_oldest_active_heartbeat_age_seconds > 600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: A Certificate A run has made no durable progress for more than ten minutes
          runbook: docs/runbooks/production-operations.md#monitoring-alerts

      - alert: BookAuditCertificateARunFailed
        expr: |
          sum(changes(bookaudit_certificate_a_runs{status=~"failed|source_changed|blocked_recovery"}[10m])) > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: A Certificate A run recently ended unsuccessfully and needs operator review
          runbook: docs/runbooks/production-operations.md#monitoring-alerts

      - alert: BookAuditHighServerErrorRate
        expr: |
          sum(rate(bookaudit_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(bookaudit_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: More than 5 percent of Certificate A requests return 5xx
          runbook: docs/runbooks/production-operations.md#monitoring-alerts

      - alert: BookAuditSlowApi
        expr: |
          sum(rate(bookaudit_http_request_duration_seconds_sum[5m]))
          /
          clamp_min(sum(rate(bookaudit_http_request_duration_seconds_count[5m])), 0.001) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Mean Certificate A API response time is above two seconds
          runbook: docs/runbooks/production-operations.md#monitoring-alerts
